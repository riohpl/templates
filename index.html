<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brunt</title>
    <style>
      body {
        width: 100%;
        margin: 0;
        background-color: #f2f2f2;
        overflow: hidden;
      }

      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        min-height: 100vh;
        gap: 20px;
      }
      .cta {
        content: url("brunt_mip_assets/Assets/CTA_button.png");
      }
      .logo {
        content: url("brunt_mip_assets/Assets/LOGO.png");
      }
      .header {
        content: url("brunt_mip_assets/Assets/TEXT.png");
      }
      .shoe {
        content: url("brunt_mip_assets/Assets/shoe_2.png");
      }
      .spin_btn {
        content: url("brunt_mip_assets/Assets/SPIN_2.png");
      }
      .spin_blink {
        animation: spin_blink 0.3s ease-in-out infinite;
      }
      .center {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      @keyframes spin_blink {
        0% {
          content: url("brunt_mip_assets/Assets/SPIN_1.png");
        }
        100% {
          content: url("brunt_mip_assets/Assets/SPIN_2.png");
        }
      }
      .shoe_blink {
        animation: shoe_blink 3s ease-in-out infinite alternate;
      }
      @keyframes shoe_blink {
        0% {
          content: url("brunt_mip_assets/Assets/shoe_1.png");
        }
        50% {
          content: url("brunt_mip_assets/Assets/shoe_2.png");
        }
        100% {
          content: url("brunt_mip_assets/Assets/shoe_3.png");
        }
      }
      .w-100 {
        width: 100%;
      }
      .w-20 {
        width: 20%;
      }
      .w-25 {
        width: 25%;
      }
      .w-80 {
        width: 80%;
      }
      .w-85 {
        width: 85%;
      }
      .ml--10 {
        margin-left: -10%;
      }
      .w-45 {
        width: 45%;
      }
      .w-min {
        width: min-content;
      }

      .w-60 {
        width: 60%;
      }
      .pulse-button {
        cursor: pointer;
        animation: pulse 1s infinite;
      }
      .flex-col {
        flex-direction: column;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.1);
        }

        100% {
          transform: scale(1);
        }
      }
      .gap-20 {
        gap: 20px;
      }
      .ml-10 {
        margin-left: 10%;
      }
      .end_card {
        margin-top: -10%;
      }
      .show {
        display: block;
      }
      .hide {
        display: none;
      }

      .landscape_header {
        display: none;
      }
      @media screen and (orientation: portrait) {
        .landscape_endcard {
          display: none;
        }
      }
      @media screen and (orientation: landscape) {
        .portrait_header {
          display: none;
        }
        .container {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0;
        }
        /* .logo {
          margin-left: -10%;
        }
        .header {
          margin-left: -10%;
        }
        .cta {
          margin-left: -10%;
        } */
        .cta-btn {
          display: none;
        }
        .landscape_header {
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
        }
      }
      @media screen and (min-width: 480px) {
        .end_card {
          margin-top: 0;
        }
      }
    </style>
  </head>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script>
      (function () {
        const mraid = window.mraid || {};
        let isViewable = false;
        let scrollInterval;
        let isAutoScrolling = true;

        // Configuration Constants
        const SCROLL_SPEED = 1; // Pixels per tick
        const SCROLL_INTERVAL = 50; // Milliseconds
        const FALLBACK_DELAY = 1000; // Delay for non-MRAID environments
        const content = document.getElementById("content");

        // Utility: Starts auto-scrolling
        const startAutoScroll = () => {
          if (!isAutoScrolling) return;
          scrollInterval = setInterval(() => {
            content.scrollTop += SCROLL_SPEED;
            if (
              content.scrollHeight - content.scrollTop <=
              content.clientHeight
            ) {
              content.scrollTop = 0; // Reset scroll to top
            }
          }, SCROLL_INTERVAL);
        };

        // Utility: Stops auto-scrolling
        const stopAutoScroll = () => {
          isAutoScrolling = false;
          clearInterval(scrollInterval);
        };

        // Utility: Handles click actions
        const handleClickAction = () => {
          if (mraid.open && typeof mraid.open === "function") {
            mraid.open();
          } else {
            window.open();
          }
        };

        // Add click event listeners to specified selectors
        const addClickHandlers = (selectors) => {
          selectors.forEach((selector) => {
            document.querySelectorAll(selector).forEach((element) => {
              element.addEventListener("click", (e) => {
                e.preventDefault();
                handleClickAction();
              });
            });
          });
        };

        // Initialize scrolling and content visibility
        const initializeScrolling = () => {
          content.style.display = "block"; // Ensure content is visible
          if (
            isViewable &&
            mraid.isViewable &&
            typeof mraid.isViewable === "function" &&
            mraid.isViewable()
          ) {
            startAutoScroll();
          }
        };

        // Initialize MRAID functionality
        const initializeMraid = () => {
          if (mraid && typeof mraid.getState === "function") {
            const state = mraid.getState();
            if (state === "loading") {
              mraid.addEventListener("ready", () => {
                isViewable = true;
                initializeScrolling();
              });
            } else {
              isViewable = true;
              initializeScrolling();
            }
          } else {
            // Fallback for non-MRAID environments
            setTimeout(initializeScrolling, FALLBACK_DELAY);
          }
        };

        // Add user interaction event listeners to stop auto-scrolling
        const addUserInteractionListeners = () => {
          ["touchstart", "mousedown", "wheel"].forEach((eventType) => {
            content.addEventListener(eventType, stopAutoScroll, {
              passive: true,
            });
          });
        };

        // Initialization logic
        const initialize = () => {
          addClickHandlers([".cta"]);
          addUserInteractionListeners();
          initializeMraid();
        };

        // Start initialization when the DOM is ready
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initialize);
        } else {
          initialize();
        }
      })();
    </script>
    <script>
      const vid = document.getElementById("vid");
      const spin_btn = document.getElementById("spin_btn");
      const end_card = document.getElementById("end_card");
      const end_card_landscape = document.getElementById("end_card_landscape");
      const vid_container = document.getElementById("vid_container");
      const playVideo = () => {
        vid.play();
        spin_btn.classList.add("spin_blink");
      };
      vid.addEventListener("ended", () => {
        const isLandscape = window.matchMedia(
          "(orientation: landscape)"
        ).matches;
        vid.classList.add("hide");
        spin_btn.classList.add("hide");
        end_card_landscape.classList.remove("hide");
        end_card_landscape.classList.add("show");
        vid_container.classList.remove("show");
        vid_container.classList.add("hide");
        end_card.classList.remove("hide");
        end_card.classList.add("show");
      });
    </script>
